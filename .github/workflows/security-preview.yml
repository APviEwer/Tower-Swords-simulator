name: V2.3 Security Preview (no deployment)

on:
  push:
    branches:
      - security/v2.3-protection
    paths:
      - 'security-build/**'
      - 'TowerSwords_V2.3_Desktop_Release.html'
      - 'TowerSwords_V2.3_Mobile_Release.html'
      - 'index.html'
      - '.github/workflows/security-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install builder
        run: npm install --no-audit --no-fund --prefix security-build
      - name: Build protected preview
        run: node security-build/build.mjs
      - name: Structural smoke tests
        run: node security-build/test.mjs
      - name: Verify manifest and release structure
        run: node security-build/validate-release.mjs
      - name: Audit generated public files for accidental source disclosure
        run: node security-build/audit-public-bundle.mjs
      - name: Install Chromium for browser regression
        run: npx --prefix security-build playwright install --with-deps chromium
      - name: Compare original and protected pages in Chromium
        run: node security-build/browser-smoke.mjs
      - name: Compare navigation, languages and skill interactions
        run: node security-build/functional-parity.mjs
      - name: Save preview for owner review
        uses: actions/upload-artifact@v4
        with:
          name: protected-preview-not-for-deployment
          path: security-build/protected-preview/
          retention-days: 7
