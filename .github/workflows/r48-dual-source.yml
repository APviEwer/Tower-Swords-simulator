name: R48 Discord + App Store dual-source archive (test only)
on:
  push:
    branches:
      - test/discord-r47-sync-20261127
    paths:
      - scripts/sync_r48_updates.py
      - .github/workflows/r48-dual-source.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/discord-r47-sync-20261127
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate syntax
        run: python -m py_compile scripts/sync_r48_updates.py
      - name: Fetch both update sources
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python scripts/sync_r48_updates.py
      - name: Save test archive to test branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/r48-updates.json
          if git diff --cached --quiet; then
            echo "R48 archive has no change"
          else
            git commit -m "data(test): synchronize R48 Discord and App Store update archive"
            git push origin HEAD:test/discord-r47-sync-20261127
          fi
